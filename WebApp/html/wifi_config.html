<!-- WiFi Configuration fragment — injected into #app by base.html SPA router -->
<div class="wifi-config-page">

    <div id="wifiConfigStatus" class="status-card-wifi">
        <div class="loading"><div class="loading-spinner"></div><div>Loading status...</div></div>
    </div>

    <div class="wifi-scan-row">
        <button class="btn btn-primary" id="scanBtn">Scan for Networks</button>
    </div>

    <div id="networkList"></div>

    <form id="wifiForm" class="wifi-form">
        <div class="form-group">
            <label>Network (SSID)</label>
            <input type="text" id="wifiSsid" class="form-control" placeholder="WiFi network name" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="wifiPass" class="form-control" placeholder="Leave empty for open networks">
        </div>
        <button type="submit" class="btn btn-primary" id="connectBtn">Connect</button>
    </form>

    <div id="wifiMessage"></div>
</div>

<script>
    (async function initWifi() {
        await loadWifiConfigStatus();
    })();

    async function loadWifiConfigStatus() {
        const result = await api.getWiFiStatus();
        const box = document.getElementById('wifiConfigStatus');
        if (result.success && result.data.connected) {
            box.className = 'status-card-wifi status-card-connected';
            box.innerHTML = `<strong>Connected</strong> &mdash; ${escHtmlW(result.data.ssid)} &bull; ${escHtmlW(result.data.ip)} &bull; ${result.data.rssi} dBm`;
        } else {
            box.className = 'status-card-wifi status-card-disconnected';
            box.innerHTML = '<strong>Not connected</strong>';
        }
    }

    document.getElementById('scanBtn').addEventListener('click', async function () {
        const list = document.getElementById('networkList');
        list.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Scanning...</div></div>';
        const result = await api.scanWiFiNetworks();
        if (!result.success || !result.data.networks.length) {
            list.innerHTML = '<div class="alert alert-info">No networks found.</div>';
            return;
        }
        list.innerHTML = result.data.networks.map((n, i) => {
            const sig = n.rssi > -50 ? 'excellent' : n.rssi > -65 ? 'good' : n.rssi > -75 ? 'fair' : 'poor';
            const lock = n.encrypted ? '&#128274;' : '&#128275;';
            return `<div class="wifi-item" onclick="selectNetwork('${escHtmlW(n.ssid)}')">
                <span>${lock} ${escHtmlW(n.ssid)}</span>
                <span class="wifi-signal ${sig}">${n.rssi} dBm</span>
            </div>`;
        }).join('');
    });

    function selectNetwork(ssid) {
        document.getElementById('wifiSsid').value = ssid;
        document.querySelectorAll('.wifi-item').forEach(el => {
            el.classList.toggle('selected', el.textContent.includes(ssid));
        });
    }

    document.getElementById('wifiForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const ssid = document.getElementById('wifiSsid').value.trim();
        const pass = document.getElementById('wifiPass').value;
        if (!ssid) { showWifiMsg('Enter a network name', 'warning'); return; }
        const btn = document.getElementById('connectBtn');
        btn.disabled = true; btn.textContent = 'Connecting...';
        const result = await api.connectToWiFi(ssid, pass);
        btn.disabled = false; btn.textContent = 'Connect';
        if (result.success && result.data.success) {
            showWifiMsg('Connected to ' + ssid + '!', 'success');
            setTimeout(loadWifiConfigStatus, 2000);
        } else {
            showWifiMsg(result.data?.message || 'Failed to connect', 'danger');
        }
    });

    function showWifiMsg(text, type) {
        const d = document.getElementById('wifiMessage');
        d.className = 'alert alert-' + type;
        d.textContent = text;
        d.style.display = 'block';
        if (type === 'success') setTimeout(() => { d.style.display = 'none'; }, 4000);
    }

    function escHtmlW(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
