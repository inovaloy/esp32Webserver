<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration - USB Port Controller</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="/Css/style.css">
</head>
<body>
    <div class='wifi-config-container'>
        <a href="/" class="back-link">Back to USB Controller</a>
        <h1>WiFi Configuration</h1>

        <div id="status" class="status-card">
            <div class="loading">Loading WiFi status...</div>
        </div>

        <button class='btn btn-primary' onclick='scanNetworks()' style='width: 100%; margin: 20px 0;'>
            Scan for Networks
        </button>
        <div id='networks'></div>

        <form id="wifiForm">
            <div class="form-group">
                <label for="ssid">WiFi Network Name (SSID)</label>
                <input type='text' name='ssid' id='ssid' class="form-control" placeholder='Enter WiFi network name' required>
            </div>
            <div class="form-group">
                <label for="password">WiFi Password</label>
                <input type='password' name='password' id='password' class="form-control" placeholder='Leave empty if no password required'>
            </div>
            <button type='submit' class="btn btn-success" style='width: 100%;'>
                Connect to Network
            </button>
        </form>

        <div id="message" style="display: none; margin-top: 15px; padding: 15px; border-radius: 8px;"></div>

        <div style='text-align: center; margin-top: 30px; color: #666; font-size: 14px;'>
            ESP32 USB Port Controller - WiFi Configuration Panel
        </div>
    </div>

    <script src="/Js/app.js"></script>
</body>
</html>
