<!-- Dashboard fragment — injected into #app by base.html SPA router -->
<div id="deviceGrid" class="device-grid">
    <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading devices...</div>
    </div>
</div>

<!-- Add device section -->
<div class="add-device-section">
    <button class="btn btn-add" id="toggleAddForm">+ Add Device</button>
    <div id="addDeviceForm" class="add-form" style="display:none;">
        <h3>Add New Device</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Device Name</label>
                <input type="text" id="newDeviceName" class="form-control"
                       placeholder="e.g. Bedroom Lamp" maxlength="15">
            </div>
            <div class="form-group">
                <label>GPIO Pin</label>
                <input type="number" id="newDevicePin" class="form-control"
                       placeholder="e.g. 26" min="0" max="39">
            </div>
        </div>
        <button class="btn btn-primary" id="addDeviceBtn">Add Device</button>
    </div>
</div>

<script>
    // ── Device rendering ──────────────────────────────────────────────
    (async function initDashboard() {
        await renderDevices();
    })();

    async function renderDevices() {
        const result = await api.getDevices();
        const grid   = document.getElementById('deviceGrid');
        if (!result.success) {
            grid.innerHTML = '<div class="alert alert-danger">Failed to load devices</div>';
            return;
        }
        const devices = result.data.devices;
        if (devices.length === 0) {
            grid.innerHTML = '<div class="empty-state">No devices added yet.<br>Use the button below to add one.</div>';
            return;
        }
        grid.innerHTML = devices.map(d => `
            <div class="device-card ${d.state ? 'device-on' : ''}" id="card-${d.index}">
                <div class="device-info">
                    <div class="device-name">${escHtml(d.name)}</div>
                    <div class="device-pin">GPIO ${d.pin}</div>
                </div>
                <div class="device-controls">
                    <label class="toggle-switch">
                        <input type="checkbox" ${d.state ? 'checked' : ''}
                               onchange="toggleDevice(${d.index}, this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                    <button class="btn-remove" onclick="removeDevice(${d.index})" title="Remove">&#10005;</button>
                </div>
            </div>
        `).join('');
    }

    async function toggleDevice(index, state) {
        const result = await api.toggleDevice(index, state);
        if (result.success && result.data.success) {
            const card = document.getElementById('card-' + index);
            if (card) card.classList.toggle('device-on', state);
        } else {
            Utils.showAlert('Failed to toggle device', 'danger');
            renderDevices();
        }
    }

    async function removeDevice(index) {
        if (!confirm('Remove this device?')) return;
        const result = await api.removeDevice(index);
        if (result.success && result.data.success) {
            renderDevices();
        } else {
            Utils.showAlert('Failed to remove device', 'danger');
        }
    }

    document.getElementById('toggleAddForm').addEventListener('click', function () {
        const form = document.getElementById('addDeviceForm');
        const show = form.style.display === 'none';
        form.style.display = show ? 'block' : 'none';
        this.textContent = show ? '✕ Cancel' : '+ Add Device';
    });

    document.getElementById('addDeviceBtn').addEventListener('click', async function () {
        const name = document.getElementById('newDeviceName').value.trim();
        const pin  = parseInt(document.getElementById('newDevicePin').value, 10);
        if (!name) { Utils.showAlert('Device name is required', 'danger'); return; }
        if (isNaN(pin) || pin < 0 || pin > 39) { Utils.showAlert('Enter a valid GPIO pin (0–39)', 'danger'); return; }
        this.disabled = true;
        this.textContent = 'Adding...';
        const result = await api.addDevice(name, pin);
        this.disabled = false;
        this.textContent = 'Add Device';
        if (result.success && result.data.success) {
            document.getElementById('newDeviceName').value = '';
            document.getElementById('newDevicePin').value  = '';
            document.getElementById('addDeviceForm').style.display = 'none';
            document.getElementById('toggleAddForm').textContent = '+ Add Device';
            renderDevices();
        } else {
            Utils.showAlert(result.data?.message || 'Failed to add device', 'danger');
        }
    });

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
