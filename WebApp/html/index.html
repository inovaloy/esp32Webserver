<html>
    <head>
        <title>USB Port Controller</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/Css/style.css">
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1>USB Port Controller</h1>
                <div class="header-controls">
                    <div class="wifi-status" id="wifiStatus">
                        <span class="status-indicator status-connecting"></span>
                        <span id="wifiText">Checking connection...</span>
                    </div>
                    <a href="/wifi_config" class="btn btn-secondary">WiFi Settings</a>
                </div>
            </header>

            <div class="controls-section">
                <div class="section-header">
                    <h2>Port Controls</h2>
                    <div class="bulk-controls">
                        <button class="btn btn-success" onclick="toggleAllPorts(true)">Plug All</button>
                        <button class="btn btn-danger" onclick="toggleAllPorts(false)">Unplug All</button>
                        <button class="btn btn-primary" onclick="refreshStatus()">Refresh</button>
                    </div>
                </div>

                <div id="loadingMessage" class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading USB port status...</p>
                </div>

                <div id="usbPortsGrid" class="usb-ports-grid" style="display: none;">
                    <!-- USB ports will be dynamically populated here -->
                </div>
            </div>

            <div class="info-section">
                <h3>System Information</h3>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Total Ports</div>
                        <div class="info-value" id="totalPorts">10</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Active Ports</div>
                        <div class="info-value" id="activePorts">-</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Inactive Ports</div>
                        <div class="info-value" id="inactivePorts">-</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Last Update</div>
                        <div class="info-value" id="lastUpdate">-</div>
                    </div>
                </div>
            </div>

            <div id="messageArea" class="message-area" style="display: none;">
                <!-- Status messages will appear here -->
            </div>

            <footer class="footer">
                <p>ESP32 USB Port Controller v1.0 | <span id="deviceTime">--:--:--</span></p>
            </footer>
        </div>

        <script src="/Js/app.js"></script>
    </body>
</html>
