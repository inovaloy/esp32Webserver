<html>
    <head>
        <title>ESP32 Webserver Index</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/Css/style.css">
    </head>
    <body>
        <div id="alertContainer"></div>

        <div class="container">
            <div id="loading-content" class="loading">
                <div class="loading-spinner"></div>
                <div>Checking WiFi connection...</div>
            </div>

            <div id="main-content" style="display: none;">
                <h1>ESP32 Webserver Control Panel</h1>

                <div id="wifiStatus" class="alert alert-info">
                    <span class="status-indicator status-connecting"></span>
                    Checking WiFi status...
                </div>

                <div class="nav-grid">
                    <a href="dshbrd" class="nav-item">📊 Dashboard</a>
                    <a href="home" class="nav-item">🏠 Home</a>
                    <a href="login" class="nav-item">🔐 Login</a>
                    <a href="wifi_config" class="nav-item btn-warning">📶 WiFi Config</a>
                    <a href="logout" class="nav-item btn-danger">🚪 Logout</a>
                </div>
            </div>
        </div>

        <script src="/Js/app.js"></script>
        <script>
            // Page-specific JavaScript
            window.addEventListener('load', function() {
                checkWiFiStatusAndRedirect();
            });

            async function checkWiFiStatusAndRedirect() {
                console.log("Checking WiFi status...");
                try {
                    const result = await api.getWiFiStatus();

                    if (result.success && result.data.connected) {
                        // WiFi is connected, show main content
                        document.getElementById('loading-content').style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                        updateWiFiStatusDisplay(result.data);
                    } else {
                        // WiFi is not connected, redirect to WiFi config page
                        Utils.showAlert('WiFi not connected. Redirecting to WiFi configuration...', 'warning');
                        setTimeout(() => {
                            window.location.href = '/wifi_config';
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Error checking WiFi status:', error);
                    // On error, show main content anyway (fallback)
                    document.getElementById('loading-content').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    Utils.showAlert('Could not check WiFi status', 'danger');
                }
            }
        </script>
    </body>
</html>
