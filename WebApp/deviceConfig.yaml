# Device Configuration
# ─────────────────────────────────────────────────────────────────────────────
# maxDevices: how many GPIO devices can be added (must be <= 16)
#
# highVoltageGpioPins: GPIO pins available for high voltage devices.
# lowVoltageGpioPins: GPIO pins available for low voltage devices.
# Once a pin is assigned to a device it disappears from the Add form.

maxDevices: 8

highVoltageGpioPins:
  - 26
  - 27
  - 25

lowVoltageGpioPins:
  - 33
  - 32
  - 17
  - 15
  - 5
