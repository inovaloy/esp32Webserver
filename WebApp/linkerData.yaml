# HTTP Request Types
httpMethods: &httpMethods
    GET : &httpGET  "GET"
    POST: &httpPOST "POST"

# Response Types
responseTypes: &responseTypes
    HTML : &rtnHTML  "HTML"
    JSON : &rtnJSON  "JSON"
    ASSET: &rtnASSET "ASSET"

# Content Types
contentTypes: &contentTypes
    CSS       : &cssType  "text/css"
    JAVASCRIPT: &jsType   "application/javascript"
    IMAGE_JPG : &jpgType  "image/jpg"
    IMAGE_PNG : &pngType  "image/png"
    JSON      : &jsonType "application/json"


# ── Shell page ────────────────────────────────────────────────────────────────
# The main authenticated shell — serves base.html which contains the SPA router.
# All app pages (dashboard, wifi config) are loaded as fragments into this shell.
"/" :
    rtnType : *rtnHTML
    fileName: "base.html"
    macro   : "BASE_HTML"
    reqType : *httpGET

# ── Standalone pages ──────────────────────────────────────────────────────────
# Login has its own full page (no auth, cannot use the shell).
"/login" :
    rtnType : *rtnHTML
    fileName: "login.html"
    macro   : "LOGIN_HTML"
    reqType : *httpGET

# ── Page fragments ────────────────────────────────────────────────────────────
# Fragments are injected into #app by the SPA router inside base.html.
# They contain only the inner HTML for that page — no <html>/<head>/<body>.
"/page/dashboard" :
    rtnType : *rtnHTML
    fileName: "dashboard.html"
    macro   : "DASHBOARD_HTML"
    reqType : *httpGET

"/page/wifi" :
    rtnType : *rtnHTML
    fileName: "wifi_config.html"
    macro   : "WIFI_CONFIG_HTML"
    reqType : *httpGET


# ── Static Assets ─────────────────────────────────────────────────────────────
"/Css/style.css" :
    rtnType    : *rtnASSET
    fileName   : "Css/style.css"
    macro      : "STYLE_CSS"
    contentType: *cssType
    reqType    : *httpGET

"/Js/app.js" :
    rtnType    : *rtnASSET
    fileName   : "Js/app.js"
    macro      : "APP_JS"
    contentType: *jsType
    reqType    : *httpGET


# ── Auth API ──────────────────────────────────────────────────────────────────
"/api/login" :
    rtnType: *rtnJSON
    reqType: *httpPOST

"/api/logout" :
    rtnType: *rtnJSON
    reqType: *httpPOST

"/api/auth/change-password" :
    rtnType: *rtnJSON
    reqType: *httpPOST


# ── WiFi API ──────────────────────────────────────────────────────────────────
"/api/wifi/status" :
    rtnType: *rtnJSON
    reqType: *httpGET

"/api/wifi/scan" :
    rtnType: *rtnJSON
    reqType: *httpGET

"/api/wifi/connect" :
    rtnType: *rtnJSON
    reqType: *httpPOST


# ── Device API ────────────────────────────────────────────────────────────────
"/api/devices" :
    rtnType: *rtnJSON
    reqType: *httpGET

"/api/devices/add" :
    rtnType: *rtnJSON
    reqType: *httpPOST

"/api/devices/remove" :
    rtnType: *rtnJSON
    reqType: *httpPOST

"/api/devices/toggle" :
    rtnType: *rtnJSON
    reqType: *httpPOST
